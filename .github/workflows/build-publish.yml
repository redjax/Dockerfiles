---
name: Build and publish images

on:
  pull_request:
    branches:
      - main

  merge_group:
    types:
      - checks_requested

  push:
    branches:
      - main
    paths:
      - "dockerfiles/**"

  workflow_dispatch:
    inputs:
      image:
        description: >-
          Optional image directory, for example
          dockerfiles/base/debian
        required: false
        type: string

      dry_run:
        description: Describe actions without building or publishing
        required: false
        default: false
        type: boolean

      force:
        description: Build every image instead of only changed images
        required: false
        default: false
        type: boolean

      enable_publish:
        description: Publish images to GHCR
        required: false
        default: false
        type: boolean

      pull:
        description: Always pull base images before building
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      image:
        description: Optional image directory to build
        required: false
        type: string

      dry_run:
        description: Describe actions without building or publishing
        required: false
        default: false
        type: boolean

      force:
        description: Build every image instead of only changed images
        required: false
        default: false
        type: boolean

      enable_publish:
        description: Publish images to GHCR
        required: false
        default: false
        type: boolean

      pull:
        description: Always pull base images before building
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    name: Determine images
    runs-on: ubuntu-latest

    outputs:
      empty: ${{ steps.buildlist.outputs.empty }}
      enable_publish: ${{ steps.meta.outputs.enable_publish }}
      pull: ${{ steps.meta.outputs.pull }}
      dry_run: ${{ steps.meta.outputs.dry_run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Normalize inputs
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ENABLE_PUBLISH: ${{ inputs.enable_publish }}
          INPUT_PULL: ${{ inputs.pull }}
        run: |
          set -euo pipefail

          dry_run="${INPUT_DRY_RUN:-false}"
          pull="${INPUT_PULL:-true}"
          enable_publish="${INPUT_ENABLE_PUBLISH:-false}"

          if [[ "$EVENT_NAME" == "push" ]]; then
            pull="true"
            enable_publish="true"
          elif [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            enable_publish="false"
          fi

          echo "event=$EVENT_NAME"
          echo "dry_run=$dry_run"
          echo "publish=$enable_publish"
          echo "pull=$pull"

          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "enable_publish=$enable_publish" >> "$GITHUB_OUTPUT"
          echo "pull=$pull" >> "$GITHUB_OUTPUT"

      - name: Determine changed images
        id: buildlist
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_FORCE: ${{ inputs.force }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          : > build_list.txt

          if [[ -n "$INPUT_IMAGE" ]]; then
            echo "$INPUT_IMAGE" > build_list.txt

          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            ./scripts/build/determine-images-to-build.sh \
              --base "$PR_BASE_SHA" \
              --head "$PR_HEAD_SHA" \
              --output build_list.txt

          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            git fetch origin main --no-tags
            base_sha="$(git rev-parse origin/main)"

            ./scripts/build/determine-images-to-build.sh \
              --base "$base_sha" \
              --head "$GITHUB_SHA" \
              --output build_list.txt

          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              ./scripts/build/determine-images-to-build.sh \
                --force \
                --output build_list.txt
            else
              ./scripts/build/determine-images-to-build.sh \
                --base "$BEFORE_SHA" \
                --head "$GITHUB_SHA" \
                --output build_list.txt
            fi

          elif [[ "${INPUT_FORCE:-false}" == "true" ]]; then
            ./scripts/build/determine-images-to-build.sh \
              --force \
              --output build_list.txt
          fi

          echo
          echo "Final build list:"

          if [[ -s build_list.txt ]]; then
            cat build_list.txt
            echo "empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "  <none>"
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build list
        if: steps.buildlist.outputs.empty == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-list
          path: build_list.txt
          if-no-files-found: error

  build:
    name: Build selected images
    needs: plan
    runs-on: ubuntu-latest

    if: needs.plan.outputs.empty == 'false'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download build list
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-list

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: >
          needs.plan.outputs.enable_publish == 'true' &&
          needs.plan.outputs.dry_run != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish images
        env:
          PUBLISH: ${{ needs.plan.outputs.enable_publish }}
          PULL: ${{ needs.plan.outputs.pull }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          chmod +x ./scripts/build/build-and-publish-images.sh

          args=()

          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          if [[ "$PULL" == "true" ]]; then
            args+=(--pull)
          fi

          ./scripts/build/build-and-publish-images.sh \
            "${args[@]}" \
            build_list.txt

  renovate-gate:
    name: Renovate gate
    needs:
      - plan
      - build
    if: always()
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Validate workflow result
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          echo "Plan result:  $PLAN_RESULT"
          echo "Build result: $BUILD_RESULT"

          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::Image planning failed."
            exit 1
          fi

          case "$BUILD_RESULT" in
            success|skipped)
              echo "Validation passed."
              ;;
            *)
              echo "::error::Docker image build failed or was cancelled."
              exit 1
              ;;
          esac
