---
############################################
# Scan repository for publishable images   #
# and build/push changed container images. #
#                                          #
# Builds only images with publish: true.   #
############################################

name: Build and publish images

on:
  push:
    branches: [main]
    # paths:
    #   - "**/Dockerfile"

  workflow_dispatch:
    inputs:
      image:
        description: "Optional path to a single image directory, i.e. dockerfiles/base/debian"
        required: false
        type: string

      dry_run:
        description: "Dry run - describe actions without taking them"
        required: false
        default: false
        type: boolean

      force:
        description: "Force - Find all images, regardless of change status"
        required: false
        default: false
        type: boolean

      enable_publish:
        description: "Publish - enable/disable publishing to container registry"
        required: false
        default: false
        type: boolean

      pull:
        description: "Always pull base images before building"
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      image:
        required: false
        type: string

      dry_run:
        required: false
        type: boolean

      force:
        required: false
        type: boolean

      enable_publish:
        description: "Publish - enable/disable publishing to container registry"
        required: false
        default: false
        type: boolean

      pull:
        description: "Always pull base images before building"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  plan:
    ## Skip runs on draft PR
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    outputs:
      empty: ${{ steps.buildlist.outputs.empty }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      force: ${{ steps.meta.outputs.force }}
      image: ${{ steps.meta.outputs.image }}
      enable_publish: ${{ steps.meta.outputs.enable_publish }}
      pull: ${{ steps.meta.outputs.pull }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6

      ## Normalize inputs so push / dispatch / call all behave the same
      - name: Normalize inputs
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          DRY_RUN="${{ inputs.dry_run || false }}"
          FORCE="${{ inputs.force || false }}"
          IMAGE="${{ inputs.image || '' }}"

          ## Pull base images by default.
          #  For push/workflow_call, always pull.
          #  For workflow_dispatch, respect user's input.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            PULL="true"
          else
            PULL="${{ inputs.pull }}"
          fi

          ## Publish by default on push to main.
          #  For workflow_dispatch/workflow_call, respect explicit inputs.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            ENABLE_PUBLISH="true"
          else
            ENABLE_PUBLISH="${{ inputs.enable_publish || false }}"
          fi

          echo "Resolved build mode: event=${{ github.event_name }}, dry_run=${DRY_RUN}, force=${FORCE}, enable_publish=${ENABLE_PUBLISH}, pull=${PULL}, image=${IMAGE:-<all>}"

          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "enable_publish=$ENABLE_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "pull=$PULL" >> "$GITHUB_OUTPUT"

      - name: Detect changed files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
              # Initial push: there is no previous commit to diff against.
              git ls-files > build_list.txt
            else
              git diff --name-only \
                "${{ github.event.before }}" \
                "${{ github.sha }}" \
                > build_list.txt
            fi
          else
            ## workflow_dispatch / workflow_call:
            #  determine-images-to-build.sh will rely on --image-dir or --force.
            : > build_list.txt
          fi

          echo "Changed files:"
          if [[ -s build_list.txt ]]; then
            cat build_list.txt
          else
            echo "  (none)"
          fi

      - name: Determine images to build
        id: buildlist
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./scripts/build/determine-images-to-build.sh

          ARGS=()

          if [[ -n "${{ steps.meta.outputs.image }}" ]]; then
            ARGS+=(--image-dir "${{ steps.meta.outputs.image }}")
            ARGS+=(--force)
          fi

          [[ "${{ steps.meta.outputs.force }}" == "true" ]] && \
            ARGS+=(--force)

          ./scripts/build/determine-images-to-build.sh \
            "${ARGS[@]}" \
            build_list.txt

          if [[ -s build_list.txt ]]; then
            echo "empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.buildlist.outputs.empty != 'true'
        with:
          name: build-list
          path: build_list.txt

  build:
    runs-on: ubuntu-latest
    needs: plan

    ## Skip runs on draft PR or when no changes are detected
    if: >
      (github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false)
      && needs.plan.outputs.empty == 'false'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-list

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: needs.plan.outputs.dry_run != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish images
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./scripts/build/build-and-publish-images.sh

          ARGS=()

          [[ "${{ needs.plan.outputs.dry_run }}" == "true" ]] && \
            ARGS+=(--dry-run)

          [[ "${{ needs.plan.outputs.force }}" == "true" ]] && \
            ARGS+=(--force)

          [[ "${{ needs.plan.outputs.enable_publish }}" == "true" ]] && \
            ARGS+=(--publish)

          [[ "${{ needs.plan.outputs.pull }}" == "true" ]] && \
            ARGS+=(--pull)

          ./scripts/build/build-and-publish-images.sh \
            "${ARGS[@]}" \
            build_list.txt
