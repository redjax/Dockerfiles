---
name: Build and publish images

on:
  pull_request:
    branches:
      - main
    paths:
      - "dockerfiles/**"

  merge_group:
    types:
      - checks_requested

  push:
    branches:
      - main
    paths:
      - "dockerfiles/**"

  workflow_dispatch:
    inputs:
      image:
        description: >-
          Optional image directory, for example
          dockerfiles/base/debian
        required: false
        type: string

      dry_run:
        description: Describe actions without building or publishing
        required: false
        default: false
        type: boolean

      force:
        description: Build every image instead of only changed images
        required: false
        default: false
        type: boolean

      enable_publish:
        description: Publish images to GHCR
        required: false
        default: false
        type: boolean

      pull:
        description: Always pull base images before building
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      image:
        description: Optional image directory to build
        required: false
        type: string

      dry_run:
        description: Describe actions without building or publishing
        required: false
        default: false
        type: boolean

      force:
        description: Build every image instead of only changed images
        required: false
        default: false
        type: boolean

      enable_publish:
        description: Publish images to GHCR
        required: false
        default: false
        type: boolean

      pull:
        description: Always pull base images before building
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    name: Determine images
    runs-on: ubuntu-latest

    ## Do not run build validation for draft PRs.
    #  The workflow still appears in the PR, but the job is skipped.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false

    outputs:
      empty: ${{ steps.buildlist.outputs.empty }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      enable_publish: ${{ steps.meta.outputs.enable_publish }}
      pull: ${{ steps.meta.outputs.pull }}
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize inputs
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ENABLE_PUBLISH: ${{ inputs.enable_publish }}
          INPUT_PULL: ${{ inputs.pull }}
        run: |
          set -euo pipefail

          image="${INPUT_IMAGE:-}"
          dry_run="${INPUT_DRY_RUN:-false}"
          pull="${INPUT_PULL:-true}"
          enable_publish="${INPUT_ENABLE_PUBLISH:-false}"

          ## Pull base images for normal repository builds.
          #  Manual dispatch and workflow_call use their explicit input.
          if [[ "$EVENT_NAME" == "push" ]]; then
            pull="true"
          fi

          ## Only pushes to main publish by default.
          #  Pull requests and merge groups must never publish.
          if [[ "$EVENT_NAME" == "push" ]]; then
            enable_publish="true"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            enable_publish="false"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            enable_publish="false"
          fi

          echo "Resolved build configuration:"
          echo "  event:           $EVENT_NAME"
          echo "  image:           ${image:-<changed images>}"
          echo "  dry run:         $dry_run"
          echo "  publish:         $enable_publish"
          echo "  pull:            $pull"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "enable_publish=$enable_publish" >> "$GITHUB_OUTPUT"
          echo "pull=$pull" >> "$GITHUB_OUTPUT"

      - name: Determine changed images
        id: buildlist
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_FORCE: ${{ inputs.force }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          : > build_list.txt

          ## A manually selected image bypasses Git change detection.
          #  The build script will still validate Dockerfile and metadata.yml.
          if [[ -n "$INPUT_IMAGE" ]]; then
            echo "$INPUT_IMAGE" > build_list.txt

          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Determining images changed by pull request."

            ./scripts/build/determine-images-to-build.sh \
              --base "$PR_BASE_SHA" \
              --head "$PR_HEAD_SHA" \
              --output build_list.txt

          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "Determining images changed by merge group."

            ## merge_group does not provide a reliably recognized expression
            #  for base_sha in workflow YAML. Compare the synthetic merge-group
            #  commit against the current main branch instead.
            git fetch origin main --no-tags

            base_sha="$(git rev-parse origin/main)"

            ./scripts/build/determine-images-to-build.sh \
              --base "$base_sha" \
              --head "$GITHUB_SHA" \
              --output build_list.txt

          elif [[ "$EVENT_NAME" == "push" ]]; then
            echo "Determining images changed by push to main."

            ## The first push to a repository has an all-zero before SHA.
            #  In that case, build every discovered image.
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              ./scripts/build/determine-images-to-build.sh \
                --force \
                --output build_list.txt
            else
              ./scripts/build/determine-images-to-build.sh \
                --base "$BEFORE_SHA" \
                --head "$GITHUB_SHA" \
                --output build_list.txt
            fi

          else
            ## workflow_dispatch and workflow_call.
            #  With no image and no force option, there is nothing to build.
            if [[ "${INPUT_FORCE:-false}" == "true" ]]; then
              echo "Force mode enabled."

              ./scripts/build/determine-images-to-build.sh \
                --force \
                --output build_list.txt
            else
              echo "No image or force option supplied."
            fi
          fi

          echo
          echo "Final build list:"
          if [[ -s build_list.txt ]]; then
            cat build_list.txt
            echo "empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "  <none>"
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build list
        if: steps.buildlist.outputs.empty == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: build-list
          path: build_list.txt
          if-no-files-found: error

  build:
    name: Build selected images
    needs: plan
    runs-on: ubuntu-latest

    if: >
      needs.plan.outputs.empty == 'false'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build list
        uses: actions/download-artifact@v4
        with:
          name: build-list

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: >
          needs.plan.outputs.enable_publish == 'true' &&
          needs.plan.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "${GITHUB_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Verify GHCR authentication
        if: >
          needs.plan.outputs.enable_publish == 'true' &&
          needs.plan.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "GHCR login completed."
          docker system info --format \
            'ServerVersion={{.ServerVersion}}'

      - name: Verify publish configuration
        if: >
          needs.plan.outputs.enable_publish == 'true' &&
          needs.plan.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "event=${{ github.event_name }}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "actor=${GITHUB_ACTOR}"
          echo "publish=${PUBLISH}"
          echo "registry=ghcr.io"

          docker info
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          PUBLISH: ${{ needs.plan.outputs.enable_publish }}

      - name: Display build list
        shell: bash
        run: |
          set -euo pipefail

          echo "Images selected for this run:"
          cat build_list.txt

      - name: Build and publish images
        shell: bash
        env:
          PUBLISH: ${{ needs.plan.outputs.enable_publish }}
          PULL: ${{ needs.plan.outputs.pull }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          chmod +x ./scripts/build/build-and-publish-images.sh

          args=()

          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          if [[ "$PULL" == "true" ]]; then
            args+=(--pull)
          fi

          ./scripts/build/build-and-publish-images.sh \
            "${args[@]}" \
            build_list.txt
