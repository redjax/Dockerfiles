---
##################################################
# Run security scanners against this repository. #
##################################################

name: Security scans

on:
  schedule:
    - cron: "0 0 */7 * *"

  workflow_dispatch:
    inputs:
      enableTrivy:
        description: Run Trivy
        required: false
        type: boolean
        default: false

      enableGitleaks:
        description: Run Gitleaks against Git history
        required: false
        type: boolean
        default: false

      enableOSV:
        description: Run OSV-Scanner against repository dependencies
        required: false
        type: boolean
        default: false

      enableTruffleHog:
        description: Run TruffleHog against Git history
        required: false
        type: boolean
        default: false

      trivyScanType:
        description: Trivy scan target
        required: false
        type: choice
        options:
          - filesystem
          - image
        default: filesystem

      trivyScanPath:
        description: Repository-relative path to scan with Trivy filesystem mode
        required: false
        type: string
        default: .

      trivyImageRef:
        description: Image reference to scan with Trivy image mode
        required: false
        type: string
        default: ""

      trivySeverity:
        description: Trivy severity levels to report
        required: false
        type: string
        default: HIGH,CRITICAL

      trivyIgnoreUnfixed:
        description: Ignore Trivy vulnerabilities without a fix
        required: false
        type: boolean
        default: true

      failOnTrivyFindings:
        description: Fail if Trivy reports findings
        required: false
        type: boolean
        default: true

      failOnGitleaksFindings:
        description: Fail if Gitleaks reports findings
        required: false
        type: boolean
        default: true

      failOnOSVFindings:
        description: Fail if OSV-Scanner reports vulnerabilities
        required: false
        type: boolean
        default: true

      failOnTruffleHogFindings:
        description: Fail if TruffleHog reports findings
        required: false
        type: boolean
        default: true

      osvRecursive:
        description: Recursively scan for dependency manifests and lockfiles
        required: false
        type: boolean
        default: true

      osvNoResolve:
        description: Disable OSV transitive dependency resolution
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy scan
    if: inputs.enableTrivy
    permissions:
      actions: read
      contents: read
      security-events: write

    uses: redjax/PipelineTemplates/.github/workflows/trivy-scan.yml@3499e4297d357ee76f53da48bbb9d8d0dc52f5d1 # main
    with:
      scan-type: ${{ inputs.trivyScanType }}
      scan-path: ${{ inputs.trivyScanPath }}
      image-ref: ${{ inputs.trivyImageRef }}
      severity: ${{ inputs.trivySeverity }}
      ignore-unfixed: ${{ inputs.trivyIgnoreUnfixed }}
      fail-on-findings: ${{ inputs.failOnTrivyFindings }}
      config-path: ""
      ignore-file: .trivyignore.yaml
      artifact-retention-days: 30
      pipelinetemplates-ref: main

  gitleaks:
    name: Gitleaks scan
    if: inputs.enableGitleaks
    permissions:
      actions: read
      contents: read
      security-events: write

    uses: redjax/PipelineTemplates/.github/workflows/gitleaks-secret-scan.yml@3499e4297d357ee76f53da48bbb9d8d0dc52f5d1 # main
    with:
      mode: git
      source: .
      config-path: .gitleaks.toml
      baseline-path: ""
      fail-on-findings: ${{ inputs.failOnGitleaksFindings }}
      generate-csv-report: true
      artifact-retention-days: 30

  osv:
    name: OSV dependency scan
    if: inputs.enableOSV
    permissions:
      actions: read
      contents: read
      security-events: write

    uses: redjax/PipelineTemplates/.github/workflows/osv-scan.yml@3499e4297d357ee76f53da48bbb9d8d0dc52f5d1 # main
    with:
      source: .
      recursive: ${{ inputs.osvRecursive }}
      config-path: ""
      no-resolve: ${{ inputs.osvNoResolve }}
      allow-no-package-sources: true
      verbosity: info
      additional-args: ""
      fail-on-vulnerabilities: ${{ inputs.failOnOSVFindings }}
      sarif-category: dockerfiles-osv
      artifact-retention-days: 30
      pipeline-templates-ref: main

  trufflehog:
    name: TruffleHog scan
    if: inputs.enableTruffleHog
    permissions:
      actions: read
      contents: read

    uses: redjax/PipelineTemplates/.github/workflows/trufflehog-secret-scan.yml@3499e4297d357ee76f53da48bbb9d8d0dc52f5d1 # main
    with:
      mode: git
      source: .
      config-path: ""
      results: verified
      fail-on-findings: ${{ inputs.failOnTruffleHogFindings }}
      artifact-retention-days: 30
