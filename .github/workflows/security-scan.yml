---
##################################################
# Run security scanners against this repository. #
##################################################

name: Security scans

on:
  schedule:
    - cron: "0 0 */7 * *"

  workflow_dispatch:
    inputs:
      enableTrivy:
        description: Run Trivy
        required: false
        type: boolean
        default: false

      enableGitleaks:
        description: Run Gitleaks
        required: false
        type: boolean
        default: false

      enableOSV:
        description: Run OSV-Scanner
        required: false
        type: boolean
        default: false

      enableCodeQL:
        description: Run CodeQL
        required: false
        type: boolean
        default: false

      enableTruffleHog:
        description: Run TruffleHog
        required: false
        type: boolean
        default: false

      trivyIgnoreFile:
        description: Repository-local Trivy ignore file
        required: false
        type: string
        default: .trivyignore.yaml

      failOnTrivyFindings:
        description: Fail when Trivy reports findings
        required: false
        type: boolean
        default: true

      failOnGitleaksFindings:
        description: Fail when Gitleaks reports findings
        required: false
        type: boolean
        default: true

      failOnOSVFindings:
        description: Fail when OSV-Scanner reports vulnerabilities
        required: false
        type: boolean
        default: true

      failOnTruffleHogFindings:
        description: Fail when TruffleHog reports findings
        required: false
        type: boolean
        default: true

      pipelineTemplatesRef:
        description: Branch, tag, or SHA in PipelineTemplates repository to checkout
        required: false
        type: string
        default: "main"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security-scans:
    name: Run security scans

    permissions:
      actions: read
      contents: read
      security-events: write

    uses: redjax/PipelineTemplates/.github/workflows/security-scans.yml@feat/unified-security-scanners
    with:
      ## Scheduled scans run Trivy, OSV-Scanner, and TruffleHog.
      #  Manual runs use the workflow_dispatch boolean inputs.
      enableTrivy: ${{ github.event_name == 'schedule' || inputs.enableTrivy }}
      enableGitleaks: ${{ inputs.enableGitleaks }}
      enableOSV: ${{ github.event_name == 'schedule' || inputs.enableOSV }}
      enableCodeQL: ${{ inputs.enableCodeQL }}
      enableTruffleHog: ${{ github.event_name == 'schedule' || inputs.enableTruffleHog }}

      ## Use the repository-local ignore file for both scheduled and manual runs.
      trivyIgnoreFile: ${{ inputs.trivyIgnoreFile || '.trivyignore.yaml' }}

      ## Scheduled scans enforce findings policies. Manual runs use their inputs.
      failOnTrivyFindings: ${{ github.event_name == 'schedule' || inputs.failOnTrivyFindings }}
      failOnGitleaksFindings: ${{ github.event_name == 'schedule' || inputs.failOnGitleaksFindings }}
      failOnOSVFindings: ${{ github.event_name == 'schedule' || inputs.failOnOSVFindings }}
      failOnTruffleHogFindings: ${{ github.event_name == 'schedule' || inputs.failOnTruffleHogFindings }}

      # pipelineTemplatesRef: main
      pipelineTemplatesRef: ${{ github.event_name == 'schedule' && 'feat/unified-security-scanners' || inputs.pipelineTemplatesRef }}
