---
###############################################################
# Trim old container images on the Github container registry. #
###############################################################

name: Trim old container images

on:
  workflow_run:
    workflows:
      - Build and publish images
    types:
      - completed

  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes (delete images when enabled. Disable for dry run)"
        required: false
        default: true
        type: boolean

      keep:
        description: "Number of versions to retain (default: 5)"
        required: false
        default: 5
        type: number

  workflow_call:
    inputs:
      apply:
        description: "Apply changes (delete images when enabled. Disable for dry run)"
        required: false
        default: true
        type: boolean

      keep:
        description: "Number of versions to retain (default: 5)"
        required: false
        default: 5
        type: number

permissions:
  contents: write
  packages: write

jobs:
  trim:
    ## Run only after successful build workflow completion
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: mikefarah/yq@751d8ad57b84f1794661bc70c0afb92a22ad7b3c # v4.53.2

      - name: Trim old container images
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          APPLY="${{ inputs.apply || false }}"
          KEEP_VERSIONS="${{ inputs.keep || 5 }}"

          echo "Running trim-images with apply=$APPLY, keep=$KEEP_VERSIONS"

          ## Run the trim script with the appropriate flags
          if [[ "$APPLY" == "true" ]]; then
            ./scripts/cleanup/trim-ghcr-images.sh --apply --keep "$KEEP_VERSIONS"
          else
            ./scripts/cleanup/trim-ghcr-images.sh --keep "$KEEP_VERSIONS"
          fi
