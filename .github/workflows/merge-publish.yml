---
name: Build and publish Docker images

on:
  push:
    branches:
      - main
    paths:
      - "dockerfiles/**"
      - "scripts/build/**"
      - ".github/workflows/build-images-publish.yml"

  workflow_dispatch:
    inputs:
      force:
        description: Build and publish every image
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and publish changed images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed images
        env:
          FORCE: ${{ inputs.force }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          args=(
            --base "$BEFORE_SHA"
            --head "$HEAD_SHA"
            --output build_list.txt
          )

          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi

          ./scripts/build/determine-images-to-build.sh "${args[@]}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish changed images
        env:
          PUBLISH: true
          PULL: true
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
        run: |
          ./scripts/build/build-and-publish-images.sh build_list.txt
